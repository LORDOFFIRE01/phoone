<!DOCTYPE html>
<html>
<head>
    <title>phoone</title>
    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: #0f1115; 
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden; 
    }

    /* Floating brand name */
    .header {
        position: absolute;
        top: 24px;
        left: 24px;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
        z-index: 100;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .video-container {
        position: relative;
        width: 100%;
        max-width: 1200px;
        height: 100vh;
        background: #181a20;
        overflow: hidden;
    }

    #remoteVideo {
        width: 100%;
        height: 100%;
        object-fit: cover; 
        background: #000;
    }

    #localVideo {
        position: absolute;
        top: 24px;
        right: 24px;
        width: 120px;
        height: 160px;
        object-fit: cover;
        border-radius: 16px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        background: #111;
        z-index: 10;
        transition: transform 0.3s ease;
    }

    /* Modern Frosted Glass Control Dock */
    .controls {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 15px;
        z-index: 20;
        background: rgba(20, 22, 27, 0.6);
        padding: 12px 24px;
        border-radius: 50px;
        backdrop-filter: blur(12px); /* The glass effect */
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    button {
        padding: 14px 28px;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        color: white;
        transition: all 0.2s ease;
    }

    /* Start Button Styles */
    .btn-start { background-color: #23a559; }
    .btn-start:hover { background-color: #1d8b4b; }

    /* Hardware Toggle Styles */
    .btn-action { background-color: #2b2d31; }
    .btn-action:hover { background-color: #383a40; }
    .btn-action.off { background-color: #da373c; } /* Turns red when muted/off */

    button:active {
        transform: scale(0.95);
    }
    </style>
</head>
<body>
    <div class="header">phoone</div>

    <div class="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay muted playsinline></video>
        
        <div class="controls">
            <button id="toggleMic" class="btn-action">Mic: ON</button>
            <button id="toggleCam" class="btn-action">Cam: ON</button>
            <button id="startCall" class="btn-start">Start Call</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const ROOM = 'family-room';
        let localStream, peerConnection;

        const servers = {
          iceServers: [
              { urls: "stun:stun.relay.metered.ca:80" },
              {
                urls: "turn:global.relay.metered.ca:80",
                username: "d25b01ec5307ea9a13c43ce0",
                credential: "JCeMZ+O/ePNtXufN",
              },
              {
                urls: "turn:global.relay.metered.ca:80?transport=tcp",
                username: "d25b01ec5307ea9a13c43ce0",
                credential: "JCeMZ+O/ePNtXufN",
              },
              {
                urls: "turn:global.relay.metered.ca:443",
                username: "d25b01ec5307ea9a13c43ce0",
                credential: "JCeMZ+O/ePNtXufN",
              },
              {
                urls: "turns:global.relay.metered.ca:443?transport=tcp",
                username: "d25b01ec5307ea9a13c43ce0",
                credential: "JCeMZ+O/ePNtXufN",
              },
          ]
        };

        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');

        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localVideo.srcObject = stream;
                localStream = stream;
                socket.emit('join', ROOM); 
            })
            .catch(error => {
                alert("Camera Blocked! Please click the slider icon next to the URL and set Camera to 'Allow'.");
                console.error("Camera Error:", error);
            });

        // --- Hardware Controls (Mute/Video Off) ---
        document.getElementById('toggleMic').onclick = () => {
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                audioTrack.enabled = !audioTrack.enabled;
                const btn = document.getElementById('toggleMic');
                btn.innerText = audioTrack.enabled ? "Mic: ON" : "Mic: OFF";
                btn.classList.toggle('off'); // Turns the button red
            }
        };

        document.getElementById('toggleCam').onclick = () => {
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                videoTrack.enabled = !videoTrack.enabled;
                const btn = document.getElementById('toggleCam');
                btn.innerText = videoTrack.enabled ? "Cam: ON" : "Cam: OFF";
                btn.classList.toggle('off'); // Turns the button red
            }
        };

        // --- The WebRTC Handshake Logic ---
        socket.on('ready', createOffer);
        
        socket.on('offer', async (offer) => {
            setupPeerConnection();
            await peerConnection.setRemoteDescription(offer);
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', answer, ROOM);
        });

        socket.on('answer', (answer) => peerConnection.setRemoteDescription(answer));
        socket.on('candidate', (candidate) => peerConnection.addIceCandidate(new RTCIceCandidate(candidate)));

        document.getElementById('startCall').onclick = createOffer;

        async function createOffer() {
            setupPeerConnection();
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('offer', offer, ROOM);
        }

        function setupPeerConnection() {
            if (peerConnection) return; 
            peerConnection = new RTCPeerConnection(servers);
            
            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }
            
            peerConnection.ontrack = event => {
                remoteVideo.srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit('candidate', event.candidate, ROOM);
                }
            };
        }
    </script>
</body>
</html>

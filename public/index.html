<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>phoone</title>
    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: #050505; 
        color: #fff;
        font-family: 'Courier New', Courier, monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden; 
    }

    .header {
        position: absolute;
        top: 24px;
        left: 24px;
        font-size: 16px;
        font-weight: bold;
        letter-spacing: 4px;
        text-transform: uppercase;
        z-index: 100;
    }

    .video-container {
        position: relative;
        width: 100%;
        height: 100vh;
        background: #000;
        overflow: hidden;
    }

    #remoteVideo {
        width: 100%;
        height: 100%;
        object-fit: cover; 
    }

    /* Draggable PIP - Sharp, minimal border */
    #localVideo {
        position: absolute;
        top: 24px;
        right: 24px;
        width: 160px;
        height: 220px;
        object-fit: cover;
        border: 1px solid #333;
        background: #0a0a0a;
        z-index: 20;
        cursor: grab; 
    }

    #localVideo:active {
        cursor: grabbing;
    }

    /* Utilitarian Control Dock */
    .controls {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
        z-index: 30;
    }

    button {
        padding: 12px 24px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 1px;
        border: 1px solid #444;
        background: #0a0a0a;
        color: #fff;
        cursor: pointer;
        transition: background-color 0.2s, color 0.2s;
        text-transform: uppercase;
    }

    button:hover {
        background: #222;
    }

    /* High-contrast primary action */
    .btn-start { 
        background: #fff; 
        color: #000;
        border: 1px solid #fff;
    }
    .btn-start:hover { 
        background: #ccc; 
    }

    .btn-end { 
        border-color: #da373c; 
        color: #da373c;
    }
    .btn-end:hover { 
        background: #da373c; 
        color: #000;
    }

    /* Strikethrough for muted states */
    .btn-action.off { 
        color: #555;
        text-decoration: line-through;
        border-color: #222;
    }
    </style>
</head>
<body>
    <div class="header">phoone</div>

    <div class="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay muted playsinline></video>
        
        <div class="controls">
            <button id="toggleMic" class="btn-action">MIC</button>
            <button id="toggleCam" class="btn-action">CAM</button>
            <button id="callBtn" class="btn-start">CONNECT</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const ROOM = 'family-room';
        let localStream, peerConnection;

        const servers = {
          iceServers: [
              { urls: "stun:stun.relay.metered.ca:80" },
              { urls: "turn:global.relay.metered.ca:80", username: "d25b01ec5307ea9a13c43ce0", credential: "JCeMZ+O/ePNtXufN" },
              { urls: "turn:global.relay.metered.ca:80?transport=tcp", username: "d25b01ec5307ea9a13c43ce0", credential: "JCeMZ+O/ePNtXufN" },
              { urls: "turn:global.relay.metered.ca:443", username: "d25b01ec5307ea9a13c43ce0", credential: "JCeMZ+O/ePNtXufN" },
              { urls: "turns:global.relay.metered.ca:443?transport=tcp", username: "d25b01ec5307ea9a13c43ce0", credential: "JCeMZ+O/ePNtXufN" }
          ]
        };

        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');

        // --- Draggable PIP Logic ---
        let isDragging = false;
        let offsetX, offsetY;

        localVideo.addEventListener('mousedown', (e) => {
            isDragging = true;
            offsetX = e.clientX - localVideo.getBoundingClientRect().left;
            offsetY = e.clientY - localVideo.getBoundingClientRect().top;
            localVideo.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            localVideo.style.right = 'auto'; 
            localVideo.style.left = (e.clientX - offsetX) + 'px';
            localVideo.style.top = (e.clientY - offsetY) + 'px';
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            localVideo.style.cursor = 'grab';
        });

        // --- Camera Setup ---
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localVideo.srcObject = stream;
                localStream = stream;
                socket.emit('join', ROOM); 
            })
            .catch(error => {
                alert("Camera blocked! Check the padlock icon in your Brave URL bar.");
                console.error("Camera Error:", error);
            });

        // --- Hardware Controls ---
        document.getElementById('toggleMic').onclick = () => {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                audioTrack.enabled = !audioTrack.enabled;
                document.getElementById('toggleMic').classList.toggle('off'); 
            }
        };

        document.getElementById('toggleCam').onclick = () => {
            if (!localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                videoTrack.enabled = !videoTrack.enabled;
                document.getElementById('toggleCam').classList.toggle('off'); 
            }
        };

        // --- WebRTC Handshake ---
        socket.on('ready', createOffer);
        
        socket.on('offer', async (offer) => {
            setupPeerConnection();
            await peerConnection.setRemoteDescription(offer);
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', answer, ROOM);
        });

        socket.on('answer', (answer) => peerConnection.setRemoteDescription(answer));
        socket.on('candidate', (candidate) => peerConnection.addIceCandidate(new RTCIceCandidate(candidate)));

        document.getElementById('callBtn').onclick = createOffer;

        async function createOffer() {
            setupPeerConnection();
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('offer', offer, ROOM);
        }

        function setupPeerConnection() {
            if (peerConnection) return; 
            peerConnection = new RTCPeerConnection(servers);
            
            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }
            
            peerConnection.ontrack = event => {
                remoteVideo.srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit('candidate', event.candidate, ROOM);
                }
            };

            peerConnection.onconnectionstatechange = () => {
                if (peerConnection.connectionState === 'connected') {
                    const callBtn = document.getElementById('callBtn');
                    callBtn.innerText = "DISCONNECT";
                    callBtn.classList.remove('btn-start');
                    callBtn.classList.add('btn-end');
                    
                    callBtn.onclick = () => {
                        window.location.reload(); 
                    };
                }
            };
        }
    </script>
</body>
</html>

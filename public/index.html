<!DOCTYPE html>
<html>
<head>
    <title>phoone</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap');

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: #050508; 
        color: #e0e0e0;
        font-family: 'Space Grotesk', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden; 
    }

    /* 90s CRT Scanline Overlay */
    .scanlines {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
        background-size: 100% 4px;
        z-index: 15;
        pointer-events: none; /* Lets you click right through it */
    }

    /* Glowing Retro Title */
    .header {
        position: absolute;
        top: 30px;
        left: 40px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: lowercase;
        z-index: 100;
        color: #ff9d00;
        text-shadow: 0 0 10px rgba(255, 157, 0, 0.6), 0 0 20px rgba(255, 157, 0, 0.4);
    }

    .video-container {
        position: relative;
        width: 100%;
        max-width: 1600px;
        height: 100vh;
        background: #0a0a0f;
        overflow: hidden;
    }

    #remoteVideo {
        width: 100%;
        height: 100%;
        object-fit: cover; 
        background: radial-gradient(circle at center, #1a1a24 0%, #050508 100%);
    }

    /* Draggable PIP Window */
    #localVideo {
        position: absolute;
        top: 30px;
        right: 40px;
        width: 160px;
        height: 220px;
        object-fit: cover;
        border-radius: 12px;
        border: 1px solid rgba(0, 255, 255, 0.3);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 255, 255, 0.2);
        background: #000;
        z-index: 20;
        cursor: grab; /* Shows the grab hand */
    }

    #localVideo:active {
        cursor: grabbing;
    }

    /* Ultra-Sleek Glass Dock */
    .controls {
        position: absolute;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 20px;
        z-index: 25;
        background: rgba(10, 10, 15, 0.5);
        padding: 16px 32px;
        border-radius: 16px;
        backdrop-filter: blur(20px); 
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }

    button {
        padding: 14px 32px;
        font-size: 15px;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        letter-spacing: 1px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        color: white;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    /* Start Button - Cyan Glow */
    .btn-start { 
        background-color: #00d2ff; 
        color: #000;
        box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
    }
    .btn-start:hover { 
        background-color: #33dbff;
        box-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
        transform: translateY(-2px);
    }

    /* End Call Button - Neon Red */
    .btn-end { 
        background-color: #ff2a2a; 
        box-shadow: 0 0 15px rgba(255, 42, 42, 0.4);
    }
    .btn-end:hover { 
        background-color: #ff4d4d; 
        box-shadow: 0 0 25px rgba(255, 42, 42, 0.6);
        transform: translateY(-2px);
    }

    /* Hardware Toggles */
    .btn-action { 
        background-color: rgba(255, 255, 255, 0.05); 
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-action:hover { 
        background-color: rgba(255, 255, 255, 0.1); 
        transform: translateY(-2px);
    }
    .btn-action.off { 
        background-color: rgba(255, 42, 42, 0.2); 
        color: #ff4d4d;
        border-color: rgba(255, 42, 42, 0.4);
    }
    </style>
</head>
<body>
    <div class="header">phoone</div>
    <div class="scanlines"></div>

    <div class="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay muted playsinline></video>
        
        <div class="controls">
            <button id="toggleMic" class="btn-action">MIC: ON</button>
            <button id="toggleCam" class="btn-action">CAM: ON</button>
            <button id="callBtn" class="btn-start">CONNECT</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const ROOM = 'family-room';
        let localStream, peerConnection;

        const servers = {
          iceServers: [
              { urls: "stun:stun.relay.metered.ca:80" },
              {
                urls: "turn:global.relay.metered.ca:80",
                username: "d25b01ec5307ea9a13c43ce0",
                credential: "JCeMZ+O/ePNtXufN",
              },
              {
                urls: "turn:global.relay.metered.ca:80?transport=tcp",
                username: "d25b01ec5307ea9a13c43ce0",
                credential: "JCeMZ+O/ePNtXufN",
              },
              {
                urls: "turn:global.relay.metered.ca:443",
                username: "d25b01ec5307ea9a13c43ce0",
                credential: "JCeMZ+O/ePNtXufN",
              },
              {
                urls: "turns:global.relay.metered.ca:443?transport=tcp",
                username: "d25b01ec5307ea9a13c43ce0",
                credential: "JCeMZ+O/ePNtXufN",
              },
          ]
        };

        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');

        // --- Draggable PIP Logic ---
        let isDragging = false;
        let offsetX, offsetY;

        localVideo.addEventListener('mousedown', (e) => {
            isDragging = true;
            offsetX = e.clientX - localVideo.getBoundingClientRect().left;
            offsetY = e.clientY - localVideo.getBoundingClientRect().top;
            localVideo.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            // Override the default right-align to allow free movement
            localVideo.style.right = 'auto'; 
            localVideo.style.left = (e.clientX - offsetX) + 'px';
            localVideo.style.top = (e.clientY - offsetY) + 'px';
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            localVideo.style.cursor = 'grab';
        });

        // --- Camera Setup ---
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localVideo.srcObject = stream;
                localStream = stream;
                socket.emit('join', ROOM); 
            })
            .catch(error => {
                alert("Camera Blocked! Please allow permissions in your browser.");
                console.error("Camera Error:", error);
            });

        // --- Hardware Controls ---
        document.getElementById('toggleMic').onclick

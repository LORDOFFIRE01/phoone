<!DOCTYPE html>
<html>
<head>
    <title>phoone</title>
    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: #0f1115; /* Deep Discord-style dark mode */
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden; /* Prevents scrollbars on mobile */
    }

    /* Floating brand name */
    .header {
        position: absolute;
        top: 24px;
        left: 24px;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
        z-index: 100;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    /* The main screen */
    .video-container {
        position: relative;
        width: 100%;
        max-width: 1200px;
        height: 100vh;
        background: #181a20;
        overflow: hidden;
    }

    /* Mom's Video (Fills the entire screen) */
    #remoteVideo {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Prevents stretching */
        background: #000;
    }

    /* Your Video (Floating Picture-in-Picture) */
    #localVideo {
        position: absolute;
        top: 24px;
        right: 24px;
        width: 120px;
        height: 160px;
        object-fit: cover;
        border-radius: 16px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        background: #111;
        z-index: 10;
        transition: transform 0.3s ease;
    }

    /* Floating control bar */
    .controls {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 20px;
        z-index: 20;
    }

    /* Discord-style button */
    button {
        padding: 16px 40px;
        font-size: 18px;
        font-weight: 600;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        background-color: #23a559; /* Green */
        color: white;
        box-shadow: 0 8px 24px rgba(35, 165, 89, 0.4);
        transition: all 0.2s ease;
    }

    button:active {
        transform: scale(0.95);
    }
    </style>
</head>
<body>
    <div class="header">phoone</div>

    <div class="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
        
        <video id="localVideo" autoplay muted playsinline></video>
        
        <div class="controls">
            <button id="startCall">Start Call</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const ROOM = 'family-room';
        let localStream, peerConnection;

        // The Disguise: Metered TURN Servers
        const servers = {
          iceServers: [
              { urls: "stun:stun.relay.metered.ca:80" },
              {
                urls: "turn:global.relay.metered.ca:80",
                username: "d25b01ec5307ea9a13c43ce0",
                credential: "JCeMZ+O/ePNtXufN",
              },
              {
                urls: "turn:global.relay.metered.ca:80?transport=tcp",
                username: "d25b01ec5307ea9a13c43ce0",
                credential: "JCeMZ+O/ePNtXufN",
              },
              {
                urls: "turn:global.relay.metered.ca:443",
                username: "d25b01ec5307ea9a13c43ce0",
                credential: "JCeMZ+O/ePNtXufN",
              },
              {
                urls: "turns:global.relay.metered.ca:443?transport=tcp",
                username: "d25b01ec5307ea9a13c43ce0",
                credential: "JCeMZ+O/ePNtXufN",
              },
          ]
        };

        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');

        // Turn on camera and tell the matchmaker we are in the room
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localVideo.srcObject = stream;
                localStream = stream;
                socket.emit('join', ROOM); 
            })
            .catch(error => {
                // If Brave blocks the camera, this alert will pop up and tell you!
                alert("Camera Blocked! Please click the slider icon next to the URL and set Camera to 'Allow'.");
                console.error("Camera Error:", error);
            });

        // --- The WebRTC Handshake Logic ---
        socket.on('ready', createOffer);
        
        socket.on('offer', async (offer) => {
            setupPeerConnection();
            await peerConnection.setRemoteDescription(offer);
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', answer, ROOM);
        });

        socket.on('answer', (answer) => peerConnection.setRemoteDescription(answer));
        socket.on('candidate', (candidate) => peerConnection.addIceCandidate(new RTCIceCandidate(candidate)));

        document.getElementById('startCall').onclick = createOffer;

        async function createOffer() {
            setupPeerConnection();
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('offer', offer, ROOM);
        }

        function setupPeerConnection() {
            if (peerConnection) return; // Don't setup twice
            peerConnection = new RTCPeerConnection(servers);
            
            // Pack our video/audio into the connection
            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }
            
            // When we receive the other person's video, put it in the right box
            peerConnection.ontrack = event => {
                remoteVideo.srcObject = event.streams[0];
            };

            // Send network routing info to the matchmaker
            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit('candidate', event.candidate, ROOM);
                }
            };
        }
    </script>
</body>
</html>
